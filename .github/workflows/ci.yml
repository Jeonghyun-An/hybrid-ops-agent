name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: 린트·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: 의존성 설치(잠금 파일 그대로)
        run: uv sync --locked
      - name: ruff 린트
        run: uv run ruff check .
      - name: ruff 포맷 검사
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest

  secrets:
    name: 비밀값 검사(gitleaks, 전체 이력)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 설치
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: gitleaks 검사
        run: ./gitleaks git --redact --verbose .
