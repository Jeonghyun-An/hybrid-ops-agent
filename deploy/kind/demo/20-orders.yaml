apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: demo
  labels:
    app: orders
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      automountServiceAccountToken: false
      containers:
        - name: orders
          image: hoa-demo:0.1.0
          imagePullPolicy: IfNotPresent
          # 이미지에 CMD가 없다(deploy/docker/Dockerfile — 실행 명령은 매니페스트·차트가 정한다)
          command: ["hoa-demo"]
          env:
            - name: HOA_DEMO_ROLE
              value: orders
            - name: HOA_DEMO_PORT
              value: "8080"
            - name: HOA_DEMO_INVENTORY_URL
              value: http://inventory
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: http
