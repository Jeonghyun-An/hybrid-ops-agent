apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
  labels:
    app: inventory
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: hoa-demo:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOA_DEMO_ROLE
              value: inventory
            - name: HOA_DEMO_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 80
      targetPort: http
