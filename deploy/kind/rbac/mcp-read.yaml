# MCP k8s-read 서버용 읽기 전용 계정 — 권한 정의는 ClusterRole 한 번, 범위는 demo 네임스페이스의 RoleBinding으로 좁힌다.
# 도구가 실제로 읽는 리소스와 동사만 넣는다(watch는 쓰지 않는다). Secret·ConfigMap은 넣지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: hoa-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hoa-mcp-read
  namespace: hoa-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hoa-k8s-read
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hoa-mcp-read
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hoa-k8s-read
subjects:
  - kind: ServiceAccount
    name: hoa-mcp-read
    namespace: hoa-system
